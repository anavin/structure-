<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StructLab 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- ไอคอน (SVG sprite) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 1-2z"/><path d="M8 3v5h8V3M8 21v-7h8v7"/></symbol>
      <symbol id="i-report" viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></symbol>
      <symbol id="i-model" viewBox="0 0 24 24"><path d="M4 20V8l8-5 8 5v12M4 8h16M4 14h16M12 3v17"/></symbol>
      <symbol id="i-deformed" viewBox="0 0 24 24"><path d="M4 20V4M20 20V4" opacity=".35"/><path d="M4 20c0-8 3-12 8-14M20 20c0-8-3-12-8-14"/></symbol>
      <symbol id="i-moment" viewBox="0 0 24 24"><path d="M3 8h18" opacity=".45"/><path d="M3 8c3 9 15 9 18 0"/><path d="M7 8v5M12 8v6M17 8v5"/></symbol>
      <symbol id="i-axial" viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></symbol>
      <symbol id="i-torsion" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M8 6a6 6 0 0 1 0 12M16 6a6 6 0 0 0 0 12"/></symbol>
      <symbol id="i-design" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 15l3-4 3 3 4-6"/></symbol>
      <symbol id="i-iso" viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></symbol>
      <symbol id="i-plan" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 12h18M12 3v18"/></symbol>
      <symbol id="i-elev" viewBox="0 0 24 24"><path d="M3 21h18M5 21V5h14v16M5 11h14M12 5v16"/></symbol>
      <symbol id="i-persp" viewBox="0 0 24 24"><path d="M4 6l8-3 8 3v12l-8 3-8-3z"/><path d="M8 8v8M16 8v8" opacity=".6"/></symbol>
      <symbol id="i-ortho" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14"/><path d="M9 5v14M15 5v14"/></symbol>
      <symbol id="i-solid" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4-8 4z"/><path d="M4 8v8l8 4 8-4V8M12 12v8"/></symbol>
      <symbol id="i-concrete" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="9" r="1.2"/><circle cx="12" cy="15" r="1"/><circle cx="16" cy="15" r=".8"/></symbol>
      <symbol id="i-axes" viewBox="0 0 24 24"><path d="M5 19V5M5 19h14M5 19l9-6"/><path d="M3 7l2-2 2 2M17 17l2 2-2 2"/></symbol>
      <symbol id="i-values" viewBox="0 0 24 24"><path d="M4 7h7M4 12h10M4 17h6"/><text x="15" y="20" font-size="9" font-weight="700" stroke="none" fill="currentColor">1.2</text></symbol>
    </defs>
  </svg>

  <header class="ribbon">
    <div class="rb-top">
      <div class="brand"><span class="logo">SL</span><b>StructLab</b><span class="ver">3D · v0.1</span></div>
      <a class="btn-link" href="./index.html">← โหมด 2D</a>
      <div class="rb-file">
        <button id="btn-open3d" class="ib-s" title="เปิดไฟล์โปรเจกต์ (.3d.json) หรือแปลน AutoCAD (.dxf) เพื่อนำเข้าเส้นกริด"><svg><use href="#i-open"/></svg>เปิด</button>
        <button id="btn-save3d" class="ib-s" title="บันทึกโปรเจกต์เป็นไฟล์"><svg><use href="#i-save"/></svg>บันทึก</button>
        <button id="btn-report3d" class="ib-s primary" title="รายการคำนวณ A4"><svg><use href="#i-report"/></svg>รายการคำนวณ</button>
        <button id="btn-dxf3d" class="ib-s" title="ส่งออกแบบโครงสร้างเป็น DXF (AutoCAD): แปลนทุกชั้น แปลนฐานราก ตารางหน้าตัด"><svg><use href="#i-plan"/></svg>DXF</button>
        <input id="file3d" type="file" accept=".json,.dxf,application/json" hidden />
        <select id="sel-example3d" title="เปิดอาคารตัวอย่าง"><option value="">ตัวอย่าง…</option></select>
      </div>
      <div class="rb-spacer"></div>
      <div class="seg" title="หน่วยที่แสดง (การคำนวณภายในเป็น kN เสมอ)">
        <button data-units="kN">kN–m</button><button data-units="tf">ตัน–m</button>
      </div>
    </div>
    <div class="rb-groups">
      <div class="rb-group">
        <div class="rb-btns">
          <button class="ib" data-display="model" title="แสดงโมเดล"><svg><use href="#i-model"/></svg><span>โมเดล</span></button>
          <button class="ib" data-display="deformed" title="รูปการเสียรูป"><svg><use href="#i-deformed"/></svg><span>เสียรูป</span></button>
          <button class="ib" data-display="Mz" title="โมเมนต์รอบแกน 3 (ดัดในระนาบ 1-2: แกนแข็งของคาน)"><svg><use href="#i-moment"/></svg><span>M33</span></button>
          <button class="ib" data-display="My" title="โมเมนต์รอบแกน 2 (ดัดในระนาบ 1-3)"><svg><use href="#i-moment"/></svg><span>M22</span></button>
          <button class="ib" data-display="N" title="แรงตามแกน"><svg><use href="#i-axial"/></svg><span>N</span></button>
          <button class="ib" data-display="T" title="แรงบิด"><svg><use href="#i-torsion"/></svg><span>T</span></button>
          <button class="ib" data-display="design" title="ระบายสีตามอัตราส่วนกำลัง"><svg><use href="#i-design"/></svg><span>ออกแบบ</span></button>
          <div class="rb-col">
            <select id="sel-result" title="ผลของ load case / ชุดผสม"></select>
            <label class="rb-range" title="สเกลแผนภาพ/การเสียรูป">สเกล <input id="scale" type="range" min="0.2" max="4" step="0.1" value="1" /></label>
          </div>
        </div>
        <div class="rb-cap">ผลการวิเคราะห์</div>
      </div>
      <div class="rb-group">
        <div class="rb-btns">
          <button class="ib" data-view="iso" title="มุมมอง 3 มิติ"><svg><use href="#i-iso"/></svg><span>3D</span></button>
          <button class="ib" data-view="plan" title="มุมมองแปลน"><svg><use href="#i-plan"/></svg><span>แปลน</span></button>
          <button class="ib" data-view="x" title="รูปด้านตามแกน X"><svg><use href="#i-elev"/></svg><span>รูปด้าน X</span></button>
          <button class="ib" data-view="y" title="รูปด้านตามแกน Y"><svg><use href="#i-elev"/></svg><span>รูปด้าน Y</span></button>
          <div class="rb-col">
            <div class="seg sm">
              <button data-proj="perspective" title="มุมมองแบบมีระยะลึก (ใกล้ใหญ่ ไกลเล็ก)"><svg><use href="#i-persp"/></svg>Persp.</button>
              <button data-proj="orthographic" title="มุมมองแบบขนาน เหมาะกับแปลน/รูปด้าน"><svg><use href="#i-ortho"/></svg>Ortho</button>
            </div>
            <label class="rb-range">ชั้น <select id="sel-level"></select></label>
          </div>
        </div>
        <div class="rb-cap">มุมมอง</div>
      </div>
      <div class="rb-group">
        <div class="rb-btns">
          <button class="ib" id="btn-solid" title="วาดเสาและคานเป็นแท่งตามหน้าตัดจริง"><svg><use href="#i-solid"/></svg><span>ขนาดจริง</span></button>
          <button class="ib" id="btn-concrete" title="ใช้สีคอนกรีตเทาในโหมดขนาดจริง"><svg><use href="#i-concrete"/></svg><span>สีคอนกรีต</span></button>
          <button class="ib" id="btn-axes" title="แสดง/ซ่อนแกน X Y Z ที่จุดกำเนิดในแบบ"><svg><use href="#i-axes"/></svg><span>แกน XYZ</span></button>
          <button class="ib" id="btn-values" title="แสดงตัวเลขค่าสูงสุดบนแผนภาพ"><svg><use href="#i-values"/></svg><span>ตัวเลข</span></button>
          <button class="ib" id="btn-slabs" title="แสดงแผ่นพื้น (สีตามแบบ S-1, S-2 …) — เมื่อเปิดคิดน้ำหนักจากพื้น"><svg><use href="#i-plan"/></svg><span>พื้น</span></button>
          <button class="ib" id="btn-loads" title="แสดงน้ำหนักบรรทุกของ load case / ชุดผสมที่เลือก (ไม่รวมน้ำหนักตัวเอง)"><svg><use href="#i-deformed"/></svg><span>น้ำหนัก</span></button>
        </div>
        <div class="rb-cap">การแสดงผล</div>
      </div>
    </div>
  </header>
  <main class="layout">
    <aside class="left"><div id="left-body" class="panel-body"></div></aside>
    <section class="center">
      <div id="view3d"></div>
      <div id="legend3d" hidden></div>
      <div id="tip3d" hidden></div>
      <div id="busy" hidden><span class="busy-text">กำลังคำนวณ…</span><div class="bar"><div class="fill"></div></div></div>
    </section>
    <aside class="right"><div id="right-body" class="panel-body"></div></aside>
  </main>
  <footer id="status" class="status"></footer>
  <div id="report" hidden></div>
  <script type="module" src="/src/app3d/main3d.ts"></script>
</body>
</html>

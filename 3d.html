<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StructLab 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">SL</span><b>StructLab</b><span class="ver">3D · v0.1</span></div>
    <a class="btn-link" href="./index.html">← โหมด 2D</a>
    <div class="grp"><button id="btn-open3d">เปิด</button><button id="btn-save3d">บันทึก</button><button id="btn-report3d" class="primary">รายการคำนวณ</button><input id="file3d" type="file" accept=".json,application/json" hidden /></div>
    <div class="tools">
      <div class="grp">
        <button data-display="model" class="active">โมเดล</button>
        <button data-display="deformed">การเสียรูป</button>
        <button data-display="Mz" title="โมเมนต์รอบแกน 3 (ดัดในระนาบ 1-2: แกนแข็งของคาน)">M33</button>
        <button data-display="My" title="โมเมนต์รอบแกน 2 (ดัดในระนาบ 1-3)">M22</button>
        <button data-display="N">N</button>
        <button data-display="T" title="แรงบิด">T</button>
        <button data-display="design" title="ระบายสีตามอัตราส่วนกำลัง">ออกแบบ</button>
        <select id="sel-result" title="ผลของ load case / ชุดผสม"></select>
        <label title="สเกล">สเกล <input id="scale" type="range" min="0.2" max="4" step="0.1" value="1" /></label>
      </div>
      <div class="grp">
        <button id="btn-axes" title="แสดง/ซ่อนแกน X Y Z ที่จุดกำเนิดในแบบ">แกน XYZ</button><button id="btn-solid" title="วาดเสาและคานเป็นแท่งตามหน้าตัดจริง">ขนาดจริง</button><button data-proj="perspective" title="มุมมองแบบมีระยะลึก (ใกล้ใหญ่ ไกลเล็ก)">Perspective</button><button data-proj="orthographic" title="มุมมองแบบขนาน (ขนาดเท่ากันทุกระยะ เหมาะกับแปลน/รูปด้าน)">Orthographic</button>
        <button data-view="iso">3D</button><button data-view="plan">แปลน</button><button data-view="x">รูปด้าน X</button><button data-view="y">รูปด้าน Y</button>
        <label>ชั้น <select id="sel-level"></select></label>
      </div>
    </div>
  </header>
  <main class="layout">
    <aside class="left"><div id="left-body" class="panel-body"></div></aside>
    <section class="center"><div id="view3d"></div><div id="busy" hidden>กำลังคำนวณ…</div></section>
    <aside class="right"><div id="right-body" class="panel-body"></div></aside>
  </main>
  <footer id="status" class="status"></footer>
  <div id="report" hidden></div>
  <script type="module" src="/src/app3d/main3d.ts"></script>
</body>
</html>
